  <style>
    @keyframes tw { from { opacity: .15 } to { opacity: 1 } }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes breathe { 50% { opacity: .75 } }
    @keyframes flick { 0%,92%,100% { opacity: 1 } 93% { opacity: .35 } 95% { opacity: 1 } 97% { opacity: .6 } }
    @keyframes sweep { from { transform: translateX(0) } to { transform: translateX(560px) } }
    @keyframes blink { 50% { opacity: 0 } }
    .ring1 { transform-origin: 150px 160px; animation: spin 6s linear infinite }
    .ring2 { transform-origin: 150px 160px; animation: spin 11s linear infinite reverse }
    .glow { animation: breathe 4s ease-in-out infinite }
    .title { animation: flick 7s steps(1) infinite }
    .sweep { animation: sweep 5s ease-in-out infinite alternate }
    .cursor { animation: blink 1s steps(1) infinite }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
