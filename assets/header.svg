      <stop offset=".64" stop-color="#7ee32a" stop-opacity=".55"/>
      <stop offset=".70" stop-color="#7ee32a" stop-opacity=".12"/>
      <stop offset=".80" stop-color="#010402" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
